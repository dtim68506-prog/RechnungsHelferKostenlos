  discount: 0,
  notes: 'Zahlbar innerhalb von 14 Tagen ab Rechnungsdatum.\nVielen Dank für Ihr Vertrauen!',
  items: [],
  logo: null
};
let itemIdCounter = 0;

const statusLabels = { draft:'Entwurf', sent:'Versendet', paid:'Bezahlt', overdue:'Überfällig' };
const localeMap = { EUR:'de-DE', USD:'en-US', GBP:'en-GB', UAH:'uk-UA' };

function fmtMoney(n){
  return new Intl.NumberFormat(localeMap[state.currency] || 'de-DE', { style:'currency', currency: state.currency }).format(n || 0);
}
function fmtDate(iso){
  if(!iso) return '—';
  const [y,m,d] = iso.split('-');
  return `${d}.${m}.${y}`;
}
function escapeHtml(str){
  return (str || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------------- Field binding ---------------- */
function getNested(obj, path){
  return path.split('.').reduce((o,k)=>o[k], obj);
}
function setNested(obj, path, value){
  const parts = path.split('.');
  let cur = obj;
  for(let i=0;i<parts.length-1;i++) cur = cur[parts[i]];
  cur[parts[parts.length-1]] = value;
}
document.querySelectorAll('[data-path]').forEach(el=>{
  const isNumber = el.type === 'number';
  const handler = () => {
    setNested(state, el.dataset.path, isNumber ? (parseFloat(el.value)||0) : el.value);
    renderPreview();
  };
  el.addEventListener('input', handler);
  el.addEventListener('change', handler);
});

/* ---------------- Items ---------------- */
const itemsBody = document.getElementById('itemsBody');

function addItem(desc, qty, rate){
  const id = itemIdCounter++;
  const item = { id, desc: desc||'', qty: qty ?? 1, rate: rate ?? 0 };
  state.items.push(item);

  const row = document.createElement('div');
  row.className = 'item-row';
  row.dataset.id = id;
  row.innerHTML = `
    <input type="text" data-field="desc" placeholder="Leistung / Produkt" value="${escapeHtml(item.desc)}">
    <input type="number" data-field="qty" min="0" step="1" placeholder="Menge" value="${item.qty}">
    <input type="number" data-field="rate" min="0" step="0.01" placeholder="Preis" value="${item.rate}">
    <button type="button" class="remove-item" title="Entfernen">×</button>
  `;
  row.querySelectorAll('input').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const it = state.items.find(i=>i.id===id);
      if(!it) return;
      const field = inp.dataset.field;
      it[field] = field === 'desc' ? inp.value : (parseFloat(inp.value)||0);
      renderPreview();
    });
  });
  row.querySelector('.remove-item').addEventListener('click', ()=>{
    state.items = state.items.filter(i=>i.id!==id);
    row.remove();
    renderPreview();
  });
  itemsBody.appendChild(row);
}

document.getElementById('addItemBtn').addEventListener('click', ()=> { addItem('', 1, 0); renderPreview(); });

/* ---------------- Logo upload ---------------- */
const logoInput = document.getElementById('logoInput');
const logoThumb = document.getElementById('logoThumb');
const logoRemoveBtn = document.getElementById('logoRemoveBtn');

document.getElementById('logoUploadBtn').addEventListener('click', ()=> logoInput.click());

logoInput.addEventListener('change', ()=>{
  const file = logoInput.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    state.logo = reader.result;
    updateLogoThumb();
    renderPreview();
  };
  reader.readAsDataURL(file);
});

logoRemoveBtn.addEventListener('click', ()=>{
  state.logo = null;
  logoInput.value = '';
  updateLogoThumb();
  renderPreview();
});

function updateLogoThumb(){
  if(state.logo){
    logoThumb.innerHTML = `<img src="${state.logo}" alt="Logo">`;
    logoRemoveBtn.style.display = 'block';
  } else {
    logoThumb.innerHTML = '<span class="empty">Kein Logo</span>';
    logoRemoveBtn.style.display = 'none';
  }
}

/* ---------------- Totals ---------------- */
function calcTotals(){
  const subtotal = state.items.reduce((s,i)=> s + (i.qty * i.rate), 0);
  const discountAmt = subtotal * (state.discount/100);
  const afterDiscount = subtotal - discountAmt;
  const taxAmt = afterDiscount * (state.taxRate/100);
  const total = afterDiscount + taxAmt;
  return { subtotal, discountAmt, afterDiscount, taxAmt, total };
}

/* ---------------- Render preview ---------------- */
function renderPreview(){
  document.getElementById('pv-number').textContent = state.number || '—';
  document.getElementById('pv-issue').textContent = fmtDate(state.issueDate);
  document.getElementById('pv-due').textContent = fmtDate(state.dueDate);

  const fromLines = [state.from.name, state.from.address, state.from.email, state.from.phone].filter(Boolean).join('\n');
  const toLines = [state.to.name, state.to.address, state.to.email].filter(Boolean).join('\n');
  document.getElementById('pv-from').textContent = fromLines || 'Noch keine Angaben';
  document.getElementById('pv-to').textContent = toLines || 'Noch keine Angaben';

  const tbody = document.getElementById('pv-items');
  tbody.innerHTML = state.items.map(i => `
    <tr>
      <td>${escapeHtml(i.desc) || '—'}</td>
      <td class="num">${i.qty}</td>
      <td class="num">${fmtMoney(i.rate)}</td>
      <td class="num">${fmtMoney(i.qty*i.rate)}</td>
    </tr>
  `).join('') || `<tr><td colspan="4" style="color:var(--ink-soft);">Noch keine Positionen</td></tr>`;

  const t = calcTotals();
  document.getElementById('pv-subtotal').textContent = fmtMoney(t.subtotal);
  document.getElementById('pv-tax-label').textContent = `MwSt. (${state.taxRate}%)`;
  document.getElementById('pv-tax').textContent = fmtMoney(t.taxAmt);
  document.getElementById('pv-total').textContent = fmtMoney(t.total);

  const discRow = document.getElementById('pv-discount-row');
  if(state.discount > 0){
    discRow.style.display = 'flex';
    document.getElementById('pv-discount-label').textContent = `Rabatt (${state.discount}%)`;
    document.getElementById('pv-discount').textContent = '−' + fmtMoney(t.discountAmt);
  } else {
    discRow.style.display = 'none';
  }

  document.getElementById('pv-notes').textContent = state.notes || '';

  const pvLogo = document.getElementById('pv-logo');
  const pvTop = document.getElementById('pvTop');
  if(state.logo){
    pvLogo.src = state.logo;
    pvLogo.style.display = 'block';
    pvTop.classList.add('has-logo');
  } else {
    pvLogo.removeAttribute('src');
    pvLogo.style.display = 'none';
    pvTop.classList.remove('has-logo');
  }

  const stamp = document.getElementById('pv-stamp');
  if(state.status === 'draft'){
    stamp.style.display = 'none';
  } else {
    stamp.style.display = 'block';
    stamp.textContent = statusLabels[state.status];
    stamp.className = 'stamp' + (state.status === 'overdue' ? ' stamp-overdue' : '');
  }
}

/* ---------------- Theme toggle ---------------- */
const root = document.documentElement;
const themeIcon = document.getElementById('themeIcon');
function setThemeIcon(theme){
  themeIcon.innerHTML = theme === 'dark'
    ? '<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>'
    : '<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" stroke-linecap="round"/>';
}
document.getElementById('themeToggle').addEventListener('click', ()=>{
  const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  root.setAttribute('data-theme', next);
  setThemeIcon(next);
});
setThemeIcon('light');

/* ---------------- Init defaults ---------------- */
function initDefaults(){
  const today = new Date();
  const due = new Date(today.getTime() + 14*24*3600*1000);
  const toISO = d => d.toISOString().slice(0,10);

  state.from = { name:'Deine Firma GmbH', email:'kontakt@deinefirma.de', phone:'+49 30 1234567', address:'Musterstraße 1\n10115 Berlin' };
  state.to = { name:'Max Mustermann', email:'max@beispiel.de', address:'Beispielweg 5\n80331 München' };
  state.issueDate = toISO(today);
  state.dueDate = toISO(due);

  document.querySelectorAll('[data-path]').forEach(el=>{
    const val = getNested(state, el.dataset.path);
    el.value = val;
  });

  addItem('Konzeption & Beratung', 4, 95);
  addItem('Umsetzung Webseite', 1, 1200);

  renderPreview();
}
initDefaults();

/* ---------------- PDF export ---------------- */
function loadImageMeta(dataUrl){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = () => resolve({ width: img.naturalWidth, height: img.naturalHeight });
    img.onerror = reject;
    img.src = dataUrl;
  });
}

document.getElementById('downloadBtn').addEventListener('click', async ()=>{
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'mm', format:'a4' });

  const ink = [28,43,58];
  const soft = [91,107,120];
  const accent = state.status === 'overdue' ? [178,58,44] : [46,107,79];
  const rule = [222,214,195];
  const t = calcTotals();

  doc.setFont('times','bold');
  doc.setFontSize(26);
  doc.setTextColor(...ink);
  doc.text('RECHNUNG', 15, 25);

  doc.setFont('helvetica','normal');
  doc.setFontSize(9);
  doc.setTextColor(...soft);
  doc.text('RechnungsHelferKostenlos', 15, 31);

  // Logo (top right) — only drawn if the user uploaded one
  let metaTopY = 18;
  if(state.logo){
    const maxW = 40, maxH = 18;
    const meta = await loadImageMeta(state.logo);
    const ratio = Math.min(maxW / meta.width, maxH / meta.height);
    const w = meta.width * ratio;
    const h = meta.height * ratio;
    const format = state.logo.startsWith('data:image/png') ? 'PNG' : 'JPEG';
    doc.addImage(state.logo, format, 195 - w, 10, w, h);
    metaTopY = 10 + h + 8;
  }

  doc.setFontSize(10);
  doc.setTextColor(...ink);
  doc.text(`Rechnungsnr.: ${state.number || '—'}`, 195, metaTopY, { align:'right' });
  doc.text(`Datum: ${fmtDate(state.issueDate)}`, 195, metaTopY + 5, { align:'right' });
  doc.text(`Fällig am: ${fmtDate(state.dueDate)}`, 195, metaTopY + 10, { align:'right' });

  let headerBottom = metaTopY + 10;

  if(state.status !== 'draft'){
    doc.setDrawColor(...accent);
    doc.setTextColor(...accent);
    doc.setFont('helvetica','bold');
    doc.setFontSize(13);
    doc.text(statusLabels[state.status].toUpperCase(), 195, metaTopY + 18, { align:'right' });
    headerBottom = metaTopY + 18;
  }

  const dividerY = Math.max(40, headerBottom + 4);
  doc.setDrawColor(...rule);
  doc.line(15, dividerY, 195, dividerY);

  const partiesLabelY = dividerY + 8;
  doc.setFont('helvetica','bold');
  doc.setFontSize(8.5);
  doc.setTextColor(...soft);
  doc.text('VON', 15, partiesLabelY);
  doc.text('RECHNUNGSEMPFÄNGER', 110, partiesLabelY);

  doc.setFont('helvetica','normal');
  doc.setFontSize(10);
  doc.setTextColor(...ink);
  const fromLines = [state.from.name, ...(state.from.address||'').split('\n'), state.from.email, state.from.phone].filter(Boolean);
  const toLines = [state.to.name, ...(state.to.address||'').split('\n'), state.to.email].filter(Boolean);
  const partiesTextY = partiesLabelY + 7;
  fromLines.forEach((line,i)=> doc.text(line, 15, partiesTextY + i*5));
  toLines.forEach((line,i)=> doc.text(line, 110, partiesTextY + i*5));

  const tableStartY = partiesTextY + Math.max(fromLines.length, toLines.length)*5 + 10;

  doc.autoTable({
    startY: tableStartY,
    head: [['Beschreibung','Menge','Preis','Betrag']],
    body: state.items.map(i => [i.desc || '—', String(i.qty), fmtMoney(i.rate), fmtMoney(i.qty*i.rate)]),
    styles: { font:'helvetica', fontSize:9.5, textColor: ink, lineColor: rule, lineWidth:0.1, cellPadding:3 },
    headStyles: { fillColor: ink, textColor:255, fontStyle:'bold', fontSize:9 },
    columnStyles: {
      1:{ halign:'right', cellWidth:22 },
      2:{ halign:'right', cellWidth:32 },
      3:{ halign:'right', cellWidth:32 }
    },
    margin:{ left:15, right:15 }
  });

  let y = doc.lastAutoTable.finalY + 10;

  function totalLine(label, value, bold){
    doc.setFont('helvetica', bold ? 'bold' : 'normal');
    doc.setFontSize(bold ? 12 : 9.5);
    doc.setTextColor(...ink);
    doc.text(label, 150, y);
    doc.text(value, 195, y, { align:'right' });
    y += bold ? 8 : 6;
  }

  totalLine('Zwischensumme', fmtMoney(t.subtotal));
  if(state.discount > 0) totalLine(`Rabatt (${state.discount}%)`, '−' + fmtMoney(t.discountAmt));
  totalLine(`MwSt. (${state.taxRate}%)`, fmtMoney(t.taxAmt));
  doc.setDrawColor(...accent);
  doc.line(150, y - 2, 195, y - 2);
  totalLine('Gesamtbetrag', fmtMoney(t.total), true);

  if(state.notes){
    y += 10;
    doc.setDrawColor(...rule);
    doc.line(15, y, 195, y);
    y += 8;
    doc.setFont('helvetica','italic');
    doc.setFontSize(9);
    doc.setTextColor(...soft);
    const noteLines = doc.splitTextToSize(state.notes, 180);
    noteLines.forEach((line,i)=> doc.text(line, 15, y + i*4.5));
  }

  doc.save(`Rechnung_${state.number || 'RechnungsHelferKostenlos'}.pdf`);
});
</script>
